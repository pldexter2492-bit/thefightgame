<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Fight Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mat:#EEF1F4; --surface:#FFFFFF; --ink:#1A2233; --muted:#5C667A; --line:#D5DBE3;
  --red:#C22A2A; --blue:#1F4FB5; --gold:#B8912E; --goldsoft:#F3E8C8; --ok:#1E7A4C;
  --shadow:0 1px 0 rgba(26,34,51,.06);
  --disp:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --mat:#111722; --surface:#1A2130; --ink:#E8ECF3; --muted:#9AA4B8; --line:#2C3547; --goldsoft:#3A3220; --shadow:none; } }
:root[data-theme="dark"]{ --mat:#111722; --surface:#1A2130; --ink:#E8ECF3; --muted:#9AA4B8; --line:#2C3547; --goldsoft:#3A3220; --shadow:none; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--mat);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mat);border-bottom:2px solid var(--ink)}
.top .row{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.grow{flex:1}
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600;line-height:1.1}
.btn.primary{background:var(--ink);color:var(--mat)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:5px 9px;font-size:14px}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-weight:600;font-size:14px;color:var(--muted);border-top:4px solid transparent}
nav.tabs button[aria-current="true"]{color:var(--ink);border-top-color:var(--red)}
h1,h2,h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.3px;margin:0}
h2{font-size:30px;font-weight:900;line-height:1;margin:18px 0 10px}
h3{font-size:20px;font-weight:800;margin:18px 0 8px}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--mat)}
.chip.empty{color:var(--muted)}
.belts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 14px}
.belt{background:var(--goldsoft);border:2px solid var(--gold);border-radius:8px;padding:6px 4px;text-align:center;min-width:0;cursor:pointer}
.belt b{display:block;font-family:var(--disp);font-weight:900;font-size:16px;color:var(--gold);line-height:1}
.belt span{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.belt.vac{background:none;border-style:dashed;border-color:var(--line);cursor:default}
.belt.vac b{color:var(--muted)}
.list{background:var(--surface);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.rowi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.rowi:last-child{border-bottom:0}
.rk{font-family:var(--disp);font-weight:900;font-size:22px;width:30px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rk.c{color:var(--gold)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);font-size:13px}
.recd{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;text-align:right;flex:none}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--gold);color:#fff;margin-left:3px;vertical-align:1px}
.pill.mine{background:var(--blue)}
.pill.inj{background:var(--red)}
.heat{flex:none;font-size:14px}
.pill.mand{background:var(--blue)}
.evcard{border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:10px 0;background:var(--surface)}
.evh{padding:8px 12px;border-bottom:2px solid var(--ink);background:var(--goldsoft)}
.evh b{display:block;font-family:var(--disp);font-size:20px;text-transform:uppercase}
.evh small{color:var(--muted)}
.evh.big{border:2px solid var(--ink);border-radius:8px;margin:16px 0 6px}
.list.flat{border:0;border-radius:0}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-decoration:underline}
.pill.pro{background:var(--ok)}
.favstar{color:var(--gold);margin-right:4px}
.simbar{max-width:760px;margin:0 auto;padding:6px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--goldsoft);font-weight:600;font-size:14px}
.oddsgrid{display:grid;grid-template-columns:1fr auto 1fr auto;gap:4px 10px;margin-top:6px;font-variant-numeric:tabular-nums}
.upset{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:2px 8px;border-radius:4px;margin-bottom:6px}
.mode:disabled{opacity:.5}
.feed{display:grid;gap:8px}
.post{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:#556}
.av-take{background:#7A2E6E}
.av-news,.av-scoop{background:var(--blue)}.av-stats,.av-tribute{background:#4E5B31}.av-fan{background:#6B4A1F}.av-fighter{background:var(--red)}
.pb{min-width:0;flex:1}.ph{font-size:14px;margin-bottom:2px}.pl{font-size:12px;margin-top:4px}
.article h1{font-family:var(--disp);font-size:34px;line-height:1;margin:6px 0}
.article p{font-size:17px;line-height:1.6}
.kicker{text-transform:uppercase;font-weight:700;color:var(--red);font-size:13px;letter-spacing:.5px;margin:14px 0 0}
.sect{color:var(--red);letter-spacing:.3px}
.pill.q{background:none;color:var(--muted);border:1px solid var(--line)}
.pic{flex:none;border-radius:6px;overflow:hidden;display:grid;place-items:center;font-family:var(--disp);font-weight:900;color:#fff;background:#445;object-fit:cover}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:12px;margin:10px 0}
.empty-state{padding:22px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:40;background:var(--mat);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ovhead{position:sticky;top:0;background:var(--mat);border-bottom:2px solid var(--ink);z-index:2}
.ovhead .row{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.hero{display:flex;gap:14px;align-items:flex-end;margin-top:14px}
.hero .pic{width:120px;height:150px;font-size:44px;border:2px solid var(--ink)}
.bigname{font-family:var(--disp);font-weight:900;font-size:38px;line-height:.95;text-transform:uppercase}
.nick{color:var(--muted);font-style:italic}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:6px 8px}
.stat b{display:block;font-family:var(--disp);font-size:24px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:76px 1fr 32px;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ink)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.hist{font-size:14px}
.hist .rowi{padding:6px 10px}
.rgroups{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.gh{margin:10px 0 2px;font-family:var(--disp);font-size:16px;text-transform:uppercase;color:var(--muted)}
.stattab td{white-space:nowrap}
@media (max-width:560px){ .rgroups{grid-template-columns:1fr} }
.summary{font-size:16px;line-height:1.55;margin:12px 0}
.recap h3{font-size:22px}
.trait{display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--blue);color:var(--blue);margin:1px 2px}
.trait.neg{border-color:var(--red);color:var(--red)}
.traitlist{display:grid;gap:6px}
.traitlist .tr{border-left:4px solid var(--blue);padding:4px 10px;background:var(--surface);border-radius:4px}
.traitlist .tr.neg{border-left-color:var(--red)}
.traitlist .tr b{display:block}.traitlist .tr span{font-size:14px;color:var(--muted)}
.tfs{border:2px solid var(--line);border-radius:6px;margin:12px 0;padding:6px 10px;max-height:320px;overflow-y:auto}
.tchk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}
.judges{display:grid;gap:4px;margin:8px 0}
.jrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;text-align:left}
.jrow small{flex:1}.jc{font-weight:700;font-variant-numeric:tabular-nums}
.res{font-family:var(--disp);font-weight:900;font-size:18px;width:22px;flex:none}
.res.W{color:var(--ok)} .res.L{color:var(--red)} .res.D{color:var(--muted)}
label.f{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
/* Fight card */
.faceoff{display:grid;grid-template-columns:1fr auto 1fr;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-top:14px;background:var(--surface)}
.corner{padding:12px;text-align:center;min-width:0}
.corner.r{background:linear-gradient(180deg,rgba(194,42,42,.14),transparent 70%)}
.corner.b{background:linear-gradient(180deg,rgba(31,79,181,.14),transparent 70%)}
.corner .pic{width:84px;height:104px;margin:0 auto 8px;font-size:32px;border:2px solid var(--ink)}
.corner.r .pic{border-color:var(--red)} .corner.b .pic{border-color:var(--blue)}
.corner .fn{font-family:var(--disp);font-weight:900;font-size:22px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.corner .fr{font-size:13px;color:var(--muted);margin-top:4px}
.vs{display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:26px;padding:0 4px;color:var(--muted)}
.tape{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tape td{padding:4px 6px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.tape td.l{color:var(--muted);font-size:12px}
.tape .win{font-weight:700}
.titlebar{background:var(--gold);color:#fff;text-align:center;font-weight:700;font-size:14px;padding:4px}
.round{border-left:4px solid var(--line);padding:6px 0 6px 12px;margin:10px 0}
.round h4{margin:0 0 4px;font-family:var(--disp);font-size:18px;text-transform:uppercase}
.round p{margin:2px 0;font-size:15px}
.round.kd{border-left-color:var(--red)}
.round .sc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.verdict{border:2px solid var(--ink);background:var(--ink);color:var(--mat);border-radius:8px;padding:14px;margin:14px 0;text-align:center}
.verdict b{display:block;font-family:var(--disp);font-size:30px;font-weight:900;text-transform:uppercase;line-height:1}
.news .rowi{align-items:flex-start}
.news .wk{font-size:12px;color:var(--muted);width:74px;flex:none;padding-top:2px}
.news .title{font-weight:600}
.money{font-family:var(--disp);font-weight:900;font-size:32px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--mat);padding:10px 14px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw}
.setup{max-width:560px;margin:0 auto;padding:30px 16px 60px}
.setup .brand{font-size:56px}
.mode{display:block;width:100%;text-align:left;border:2px solid var(--ink);background:var(--surface);border-radius:8px;padding:14px;margin:10px 0}
.mode b{font-family:var(--disp);font-size:26px;font-weight:900;text-transform:uppercase;display:block}
.sel{outline:3px solid var(--red)}
.scroll{overflow-x:auto}
@media (max-width:420px){ .bigname{font-size:32px} .stats{grid-template-columns:repeat(2,1fr)} .belt span{font-size:11px} }
@media (prefers-reduced-motion:no-preference){ .round.new{animation:pop .35s ease-out} @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>

// ================= BETTING ODDS =================
// Calibrated against thousands of simulated fights: win probability follows the rating gap closely.
function winProb(W, A, B, fg){
  let d=ovrOf(A.attrs)-ovrOf(B.attrs);
  if(fg && fg.titles && fg.titles.length){ const b=W.belts[fg.div]||{}; if(BELTS.some(k=>b[k]===A.id)) d+=1.2; if(BELTS.some(k=>b[k]===B.id)) d-=1.2; }
  if(fg && fg.short===A.id) d-=1.5; if(fg && fg.short===B.id) d+=1.5;
  if(isOut(W,A)) d-=2; if(isOut(W,B)) d+=2;
  d -= ((A.wear||0)-(B.wear||0))/60;
  return clamp(1/(1+Math.exp(-0.27*d)),.05,.94); // betting markets price in more uncertainty than the engine
}
function oddsFor(W, fg){
  const A=W.fighters[fg.a], B=W.fighters[fg.b]; if(!A||!B) return null;
  const draw=.015, pa=winProb(W,A,B,fg)*(1-draw), pb=(1-draw)-pa;
  const dI=Math.max(0,divIndex(fg.div)), base=.52-dI*.018;
  const stop=(x,y,edge)=>clamp(base+(x.attrs.pow-y.attrs.chin)*.009+Math.max(0,edge)*.012,.08,.9);
  const d=ovrOf(A.attrs)-ovrOf(B.attrs);
  const aKO=pa*stop(A,B,d), bKO=pb*stop(B,A,-d);
  return {pa, pb, draw, aKO, aDec:pa-aKO, bKO, bDec:pb-bKO};
}
function moneyline(p){ const q=Math.min(.95,p*1.045); return q>=.5? -Math.round(q/(1-q)*100/5)*5 : "+"+Math.round((1-q)/q*100/5)*5; }
function mlText(p){ const m=moneyline(p); return (typeof m==="number"? String(m) : m); }

// Serious personal events are limited to generated fighters unless the player turns them on for real fighters.
function eventEligible(W,f){ return !f.retired && (f.fictional || W.realEvents); }
function dopingCheck(W, fg){

  const top=fg.titles.length || Math.min(rankOf(W,fg.a)||99,rankOf(W,fg.b)||99)<=15; if(!top) return null;
  for(const side of ["a","b"]){ const f=W.fighters[fg[side]]; if(!eventEligible(W,f)) continue;
    if(rnd() < (.006 + (f.ped||0))*STW(W,'doping')*(W.era&&yearOf(W)<2000?.35:1)){ return suspend(W,f,"failed a pre-fight drug test",ri(26,78),fg); } }

}

}
function isSuspended(W,f){ return !!(f.susp && f.susp.until>W.week); }
function commissionReview(W){
  // badly worn veterans get their licenses denied
  Object.values(W.fighters).forEach(f=>{
    if(f.retired||f.booked||f.managed) return;
    if((f.wear||0)>140 && f.age>=36 && rnd()<.25){ quietRetire(W,f); if(rankOf(W,f.id)<=50||!f.fictional||f.champEver) addNews(W,`The commission declines to renew ${f.name}'s license after years of punishment. His career is over at ${f.age}.`,"ret"); }

const LIFE_EVENTS=[
  {k:"arrest", p:.004, run:(W,f)=>{ const serious=rnd()<.3; const wk=serious?ri(30,70):ri(6,16); f.susp={until:W.week+wk, why:"legal trouble"}; f.pop=clamp(f.pop-(serious?10:4),1,99);
      cancelFight(W,f); return serious? `${f.name} is arrested and faces serious charges. His career is on hold indefinitely.` : `${f.name} is arrested over the weekend. His team says he'll be back in the ring soon.`; }},
  {k:"tragedy", p:.004, run:(W,f)=>{ f.injury={t:"personal", until:W.week+ri(10,26)}; f.pop=clamp(f.pop+2,1,99); cancelFight(W,f);

  {k:"accident", p:.0006, run:(W,f)=>{ quietRetire(W,f);

  {k:"death", p:.00012, run:(W,f)=>{ quietRetire(W,f); f.deceased=true;

  {k:"comeback", p:0, run:()=>null}

function cancelFight(W,f){ if(!f.booked) return; const g=W.fights.find(x=>x.id===f.booked); if(g){ const o=W.fighters[g.a===f.id?g.b:g.a]; g.done=true; if(o) o.booked=null; unassignEvent(W,g); } f.booked=null; W.fights=W.fights.filter(x=>!x.done); }

  Object.values(W.fighters).forEach(f=>{

const OLY_WEIGHTS=[["51kg","FLW"],["57kg","FW"],["63.5kg","SLW"],["71kg","SWW"],["80kg","LHW"],["92kg","CW"],["+92kg","HW"]];
const OLY_HOSTS={2028:"Los Angeles",2032:"Brisbane",2036:"TBD",2040:"TBD",2044:"TBD"};
const OLY_NATS=["US","GB","CU","UZ","KZ","JP","PH","MX","UA","IE","FR","IT","BR","TH","IN","CN","KR","AU","GH","NG","DO","PR","CO","VE","DE","PL","AZ","ES","MA","TR"];
function olympics(W){
  const yr=yearOf(W), wkOfYear=(W.week+W.startWeek)%52;
  if(yr%4!==0 || wkOfYear!==31 || (W.oly&&W.oly[yr])) return;
  if(W.era && histOlympics(W,yr)) return;
  W.oly=W.oly||{}; const games={year:yr, host:OLY_HOSTS[yr]||"TBD", events:[]};
  OLY_WEIGHTS.forEach(([cls,dk])=>{
    // 16-boxer bracket of amateurs; talent drives results
    let field=[]; for(let i=0;i<16;i++){ const nat=OLY_NATS[(i*7+hashStr(cls+yr))%OLY_NATS.length]; field.push({name:uniqueName(W,nat), nat, tal:rr(60,96)}); }
    field.sort((a,b)=>b.tal-a.tal);
    let round=field.slice(); const bronze=[]; let silverF=null;
    while(round.length>1){ const nxt=[]; for(let i=0;i<round.length;i+=2){ const x=round[i], y=round[i+1]; const px=1/(1+Math.exp(-(x.tal-y.tal)/6)); const w=rnd()<px?x:y, l=w===x?y:x; nxt.push(w); if(round.length===4) bronze.push(l); if(round.length===2) silverF=l; } round=nxt; }
    const gold=round[0], silver=silverF;
    // silver is the final's loser: recompute simply as best remaining non-bronze
    games.events.push({cls, dk, gold:{name:gold.name,nat:gold.nat}, silver:{name:silver.name,nat:silver.nat}, bronze:bronze.map(b=>({name:b.name,nat:b.nat}))});
    // medalists turn pro over the next months with extra potential
    [[gold,"gold",ri(89,97)],[silver,"silver",ri(86,93)],...bronze.map(b=>[b,"bronze",ri(82,90)])].forEach(([m,med,pot])=>{
      W.olyQueue=W.olyQueue||[]; W.olyQueue.push({name:m.name, nat:m.nat, dk, med, pot, cls, yr, wk:W.week+ri(4,30)}); });
  });
  W.oly[yr]=games;
  const us=games.events.filter(e=>e.gold.nat==="US").length;
  addNews(W,`The ${yr} Olympic boxing tournament in ${games.host} wraps up. ${games.events.map(e=>`${e.cls}: ${e.gold.name} (${e.gold.nat})`).join("; ")}.`,"award");
}
function olyTurnPro(W){
  if(!W.olyQueue||!W.olyQueue.length) return;
  W.olyQueue=W.olyQueue.filter(q=>{
    if(q.wk>W.week) return true;
    if(!W.order[q.dk]||!W.order[q.dk].length) return false;
    const style=pick(STYLES), ovr=clamp(q.pot-ri(12,17),60,80);
    const f=newFighter({name:q.name, nat:q.nat, age:ri(20,25), div:q.dk, w:0,l:0,d:0,ko:0, style, attrs:makeAttrs(ovr,style,q.name+q.yr), pop:q.med==="gold"?ri(40,55):q.med==="silver"?ri(30,42):ri(22,34), verified:2, fictional:true, lastFight:W.week-8});
    f.pot=q.pot; f.potTrue=q.pot-ri(0,3); f.peak=ri(28,31); f.amateur=`Olympic ${q.med} medalist (${q.yr})`; f.wear=0;
    migrateFighter(f); W.fighters[f.id]=f; W.order[q.dk].push(f.id); const destP=f.promoter; if(toFreeAgency(W,f,destP)) addNews(W,`Olympic ${q.med} medalist ${f.name} is weighing offers from promoters.`,"gen");
    if(q.med==="gold"||q.med==="silver") addNews(W,`${f.name}, the ${q.yr} Olympic ${q.med} medalist at ${q.cls}, turns pro with ${PROMAP[f.promoter].n}. He'll debut at ${DIVMAP[q.dk].n.toLowerCase()}.`,"gen");
    return false;
  });
}

function addLeg(W,f,pts,div){ if(!f||!pts) return; f.leg=(f.leg||0)+pts; f.legDiv=f.legDiv||{}; f.legDiv[div]=(f.legDiv[div]||0)+pts; W.monthLeg=W.monthLeg||{}; W.monthLeg[f.id]=(W.monthLeg[f.id]||0)+pts; }
function legacyFromFight(W, fight, out, A, B, pre, won){
  if(!out.winner) return; const wi=out.winner===A.id?0:1, Wn=wi?B:A, Ln=wi?A:B;
  const or = pre.held[1-wi].length? 1 : (pre.rank[1-wi]||99);

  if(fight.titles.length){ if(won.length){ pts+=8+(won.length-1)*2; if(pre.held[wi].length) pts+=6; if(allBelts(W,Wn.id).some(x=>x.div!==fight.div)) pts+=10; } else pts+=4+(fight.titles.length-1); }
  if(/KO/.test(out.method)) pts*=1.1; if(out.upset) pts*=1.15;

}
function legacyYear(W){
  const ids=p4p(W); ids.forEach((id,i)=>addLeg(W,W.fighters[id], i===0?5 : i<3?3 : 1.5, W.fighters[id].div));
  DIVS.forEach(d=>BELTS.forEach(k=>{ const id=W.belts[d.k][k]; if(id) addLeg(W,W.fighters[id],.4,d.k); }));
  const A=W.awards&&W.awards[yearOf(W)-1]; if(A&&A.fighter&&W.fighters[A.fighter.id]) addLeg(W,W.fighters[A.fighter.id],5,W.fighters[A.fighter.id].div);
}
function hallOfFame(W){
  W.hof=W.hof||[]; const yr=yearOf(W); if(W.hofYear===yr) return; W.hofYear=yr;

  if(!elig.length) return;

function primaryDiv(f){ const m=f.legDiv||{}; return Object.keys(m).sort((a,b)=>m[b]-m[a])[0]||f.div; }

function bioOf(W,f){
  const P=[], ln=lastName(f.name), yr=wk=>yearOf(W,wk);
  const reigns=[]; DIVS.forEach(d=>BELTS.forEach(k=>(W.lineage&&W.lineage[d.k]&&W.lineage[d.k][k]||[]).forEach(x=>{ if(x.id===f.id) reigns.push({...x,div:d.k,belt:k}); })));

  if(f.amateur) intro+=`, and came to the pros as ${/^[AEIOU]/i.test(f.amateur)?"an":"a"} ${f.amateur.toLowerCase()}`;
  intro+=`. ${f.fictional?"He began his career in this world":"He entered this world"} ${f.hist.length? `with a record of ${Math.max(0,f.w-f.hist.filter(x=>x.r==="W").length)}-${Math.max(0,f.l-f.hist.filter(x=>x.r==="L").length)}` : `at ${rec(f)}`}, trained by ${trainerOf(W,f).name==='Self-trained'?'no one but himself':trainerOf(W,f).name} and ${(f.promoter||'IND')==='IND'?'promoting himself independently':`promoted by ${PROMAP[f.promoter].n}`}.`;
  P.push(intro);
  const wins=f.hist.filter(x=>x.r==="W"), big=wins.filter(x=>(x.or||99)<=10 || (x.t&&x.t.length)).slice(0,4);
  if(reigns.length){
    const first=reigns.filter(r=>r.from!==null).sort((a,b)=>a.from-b.from)[0];
    const divs=[...new Set(reigns.map(r=>r.div))], totalDef=reigns.reduce((s,r)=>s+r.def,0);
    let s=first? `He won his first world title in ${yr(first.from)}, ${first.how}, to take the ${first.belt==="RING"?"Ring":first.belt} ${DIVMAP[first.div].n.toLowerCase()} belt.` : `He was already a world champion when this world began.`;
    if(divs.length>1) s+=` He went on to become a ${divs.length}-division world champion (${divs.map(d=>DIVMAP[d].n.toLowerCase()).join(", ")}).`;
    const bestR=reigns.slice().sort((a,b)=>b.def-a.def)[0];
    if(bestR && bestR.def>=3) s+=` His best reign produced ${bestR.def} successful defenses of the ${bestR.belt==="RING"?"Ring":bestR.belt} title.`;
    else if(totalDef) s+=` He made ${totalDef} successful title defense${totalDef>1?"s":""} in all.`;
    const lost=reigns.filter(r=>r.end&&r.end.startsWith("lost")).sort((a,b)=>b.to-a.to)[0]; if(lost) s+=` He ${reigns.every(r=>r.to!==null)?"finally ":""}lost a title in ${yr(lost.to)} when he ${lost.end}.`;
    P.push(s);
  } else if((f.best||999)<=10){ P.push(`He climbed as high as No. ${f.best} in the ${DIVMAP[f.div].n.toLowerCase()} rankings${f.champEver?"":", though a world title stayed just out of reach"}.`); }
  if(big.length) P.push(`His signature wins include ${big.map(x=>`${x.opp} (${/KO/.test(x.m)?x.m+" "+x.rd:x.m}, ${yr(x.wk)})`).join(", ")}.`);
  const rv=Object.values(W.rivals||{}).filter(r=>(r.a===f.id||r.b===f.id) && meetings(W,r.a,r.b)>=2).sort((a,b)=>meetings(W,b.a,b.b)-meetings(W,a.a,a.b))[0];
  if(rv){ const oid=rv.a===f.id?rv.b:rv.a, o=W.fighters[oid]; const hh=h2h(W,f.id,oid); if(o) P.push(`His defining rivalry was with ${o.name}: they met ${hh.w+hh.l+hh.d} times, and ${ln} ${hh.w>hh.l?`came out ahead ${hh.w}-${hh.l}`:hh.w<hh.l?`trailed ${hh.w}-${hh.l}`:`split them ${hh.w}-${hh.l}`}${hh.d?` with ${hh.d} draw${hh.d>1?"s":""}`:""}.`); }
  const awards=Object.entries(W.awards||{}).filter(([y,a])=>a.fighter&&a.fighter.id===f.id).map(([y])=>y); if(awards.length) P.push(`He was named Fighter of the Year ${awards.length>1?awards.length+" times ("+awards.join(", ")+")":"in "+awards[0]}.`);
  let end;
  if(f.deceased) end=`${ln} passed away at ${f.age}, with a final record of ${rec(f)}.`;
  else if(f.retired) end=`He retired ${f.retiredWk!==undefined?`in ${yr(f.retiredWk)} `:""}at ${f.age} with a record of ${rec(f)} (${f.ko} KOs).`;
  else end=`At ${f.age}, he's ${rankOf(W,f.id)?`ranked No. ${rankOf(W,f.id)} at ${DIVMAP[f.div].n.toLowerCase()}`:"still active"} with a record of ${rec(f)}${f.age<f.peak-1?", and his best years may still be ahead of him":f.age>f.peak+2?", and the clock is ticking":""}.`;
  if(f.hof) end+=` He was inducted into the Hall of Fame in ${f.hof}.`;
  P.push(end);
  return P;
}

}

async function gzipB64(str){ const cs=new CompressionStream("gzip"); const buf=await new Response(new Blob([str]).stream().pipeThrough(cs)).arrayBuffer(); let bin=""; const u=new Uint8Array(buf); for(let i=0;i<u.length;i+=32768) bin+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return btoa(bin); }
async function gunzipB64(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); const ds=new DecompressionStream("gzip"); return await new Response(new Blob([u]).stream().pipeThrough(ds)).text(); }
const Store = {
  idb:null, cloud:null, uid:null, assets:null, downloads:null, lastCloud:0, timer:null,
  async openIdb(){
    try{ this.idb = await new Promise((res,rej)=>{ const r=indexedDB.open("fightgame",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
    catch(e){ this.idb=null; }
  },
  idbGet(k){ return new Promise(res=>{ if(!this.idb) return res(null); try{ const t=this.idb.transaction("kv").objectStore("kv").get(k); t.onsuccess=()=>res(t.result||null); t.onerror=()=>res(null);}catch(e){res(null);} }); },
  idbSet(k,v){ return new Promise(res=>{ if(!this.idb) return res(false); try{ const tx=this.idb.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch(e){res(false);} }); },
  async connect(){
    if(!window.claude || !window.claude.use) return;
    try{
      const [db,user,assets,dl] = await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets"),claude.use("downloads")]);
      this.assets=assets; this.downloads=dl;
      if(db && user){ const id = await user.id(); if(id){ this.cloud=db; this.uid=id; } }
    }catch(e){}
  },
  slot:"s1",
  key(){ return this.slot==="s1"? "world" : "world:"+this.slot; },
  base(){ return this.slot==="s1"? `data/users/${this.uid}/save` : `data/users/${this.uid}/saves/${this.slot}`; },
  async cloudLoad(){
    if(!this.cloud) return null;
    try{
      const m = await this.cloud.doc(this.base()+"/meta").get(); if(!m.exists) return null;
      const meta=m.data(); let s="";
      for(let i=0;i<meta.n;i++){ const c=await this.cloud.doc(this.base()+"/c"+i).get(); if(!c.exists) return null; s+=c.data().s; }
      if(meta.gz) s=await gunzipB64(s);
      const w=JSON.parse(s); return w;
    }catch(e){ return null; }
  },
  async cloudSave(W){
    if(!this.cloud) return;
    try{
      const copy = JSON.parse(JSON.stringify(W));
      Object.values(copy.fighters).forEach(f=>{ if(f.portrait && f.portrait.startsWith("data:")) f.portrait=""; });
      copy.results.forEach((r,i)=>{ if(i>15) r.log=null; });
      let s=JSON.stringify(copy), gz=false;
      if(typeof CompressionStream!=="undefined"){ try{ s=await gzipB64(s); gz=true; }catch(e){} }
      const size=180000, n=Math.ceil(s.length/size);
      for(let i=0;i<n;i++) await this.cloud.doc(this.base()+"/c"+i).set({s:s.slice(i*size,(i+1)*size)});
      await this.cloud.doc(this.base()+"/meta").set({n, gz, savedAt:W.savedAt});
      this.lastCloud=Date.now();
    }catch(e){ /* keep local copy */ }
  },
  save(W, now){
    W.savedAt=Date.now();
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{ this.idbSet(this.key(),W); this.touchSlot(W); if(Date.now()-this.lastCloud>15000) this.cloudSave(W); }, now?0:400);
  },
  flush(W){ if(!W) return; this.idbSet(this.key(),W); this.touchSlot(W); this.cloudSave(W); },
  async slots(){ return (await this.idbGet("slots")) || []; },
  async touchSlot(W){ const L=await this.slots(); let e=L.find(x=>x.id===this.slot); if(!e){ e={id:this.slot, name:W.slotName||("World "+(L.length+1))}; L.push(e); }
    e.mode=W.mode; e.date=dateLabel(W); e.updated=Date.now(); e.name=W.slotName||e.name; await this.idbSet("slots",L); await this.idbSet("curSlot",this.slot); }
};

let SIM=null; // running sim state
async function runSim(maxWeeks, targetFn, label){
  if(SIM) return; V.undo=JSON.stringify(W); V.overlay=null;
  const from=W.week+1, ids=[]; SIM={stop:false, done:0, total:maxWeeks, label, reason:null};
  const stops=W.stops||(W.stops={title:true, upset:true, fav:true, favHurt:true, scandal:false});
  const newsBefore=()=>W.news.length?W.news[0]:null;
  while(SIM.done<maxWeeks && !SIM.stop){
    const dueMine=W.fights.filter(f=>f.wk<=W.week+1 && (F(f.a).managed||F(f.b).managed));
    if(dueMine.length){ SIM.reason="Your fighter is up this week."; break; }
    const top=newsBefore(); const outs=advanceWeek(W); outs.forEach(o=>ids.push(o.id)); SIM.done++;
    const fresh=[]; for(const n of W.news){ if(n===top) break; fresh.push(n); }
    const favIn=r=>isFav(r.a)||isFav(r.b);
    if(stops.title){ const t=outs.find(o=>o.titles.length && o.winner && o.pre && !BELTS.some(k=>(o.titles.includes(k))&&false) && fresh.some(n=>n.kind==="title"&&n.ref===o.id&&/new/.test(n.text))); if(t){ SIM.reason=`New champion: ${F(t.winner).name}.`; } }
    if(!SIM.reason && stops.upset){ const u=outs.find(o=>o.upset && (o.titles.length || (o.pre&&Math.min(o.pre[0]||99,o.pre[1]||99)<=10))); if(u) SIM.reason=`Upset: ${F(u.winner).name} won as a ${u.winOdds} underdog.`; }
    if(!SIM.reason && stops.fav){ const r=outs.find(favIn); if(r) SIM.reason=`A fighter you follow just fought: ${r.an} vs ${r.bn}.`; }
    if(!SIM.reason && stops.favHurt){ const n=fresh.find(n=>(n.kind==="inj"||n.kind==="scandal"||n.kind==="tragic") && (W.favs||[]).some(id=>F(id)&&n.text.includes(F(id).name))); if(n) SIM.reason=n.text; }
    if(!SIM.reason && stops.scandal){ const n=fresh.find(n=>n.kind==="scandal"||n.kind==="tragic"); if(n) SIM.reason=n.text; }
    if(!SIM.reason && W.desk && stops.desk!==false){ const q=W.fights.filter(g=>g.review && g.revWk===W.week); if(q.length) SIM.reason=`Booking desk: ${q.length} fight${q.length>1?"s need":" needs"} your approval (${F(q[0].a).name} vs ${F(q[0].b).name}).`; }
    const tr = targetFn? targetFn(outs, fresh) : null; if(tr && !SIM.reason) SIM.reason=tr;
    if(SIM.reason) break;
    if(SIM.done%2===0){ render(); await new Promise(r=>setTimeout(r,0)); }
  }
  const reason=SIM.reason||(SIM.stop?"Stopped.":null); SIM=null;
  W.lastRecap={from, to:W.week, ids, reason}; persist();
  if(W.fights.some(f=>f.wk<=W.week+1 && (F(f.a).managed||F(f.b).managed))){ V.overlay={t:"night"}; render(); return; }
  if(reason && /^Booking desk/.test(reason)){ V.overlay={t:"commish",tab:"desk"}; render(); window.scrollTo(0,0); toast(reason); return; }
  if(ids.length && W.showRecap!==false){ V.overlay={t:"recap"}; render(); window.scrollTo(0,0); } else { render(); toast(reason||dateLabel(W)); }
}
const isFav=id=>!!(W&&W.favs&&W.favs.includes(id));
function toggleFav(id){ W.favs=W.favs||[]; const i=W.favs.indexOf(id); if(i>-1) W.favs.splice(i,1); else W.favs.push(id); persist(); }

function migrateDual(w){ // seed Benavidez's WBC light heavyweight title in worlds created before multi-division champions
  if(w.dualFix) return; w.dualFix=true;
  const bz=Object.values(w.fighters).find(f=>f.name==="David Benavidez"&&!f.retired);
  if(bz && w.belts.LHW && !w.belts.LHW.WBC && w.lineage && w.lineage.LHW && !(w.lineage.LHW.WBC||[]).length && !w.fights.some(f=>f.div==="LHW"&&f.titles.includes("WBC"))){ w.belts.LHW.WBC=bz.id; w.lineage.LHW.WBC=[{id:bz.id,name:bz.name,from:null,to:null,def:0,how:"Champion at start"}]; }
}
function migrateH2H(w){ if(w.h2hFix) return; w.h2hFix=true; Object.values(w.rivals||{}).forEach(r=>{ if(r.h2h) return; const f=w.fighters[r.a]; const hs=(f&&f.hist||[]).filter(x=>x.oppId===r.b); if(hs.length) r.h2h={[r.a]:hs.filter(x=>x.r==="W").length,[r.b]:hs.filter(x=>x.r==="L").length,d:hs.filter(x=>x.r==="D").length}; }); }
function migratePop(w){ if(w.popFix) return; w.popFix=true; Object.values(w.fighters).forEach(f=>{ if(POP_KNOWN[f.name]) f.pop=POP_KNOWN[f.name]; else if(!f.fictional && f.pop>80) f.pop=Math.round(60+(f.pop-60)*.5); }); }
function migrateContracts(w){ (w.fights||[]).forEach(f=>{ if(f.contract && !f.contract.clauses) f.contract.clauses={a:f.contract.clause==="a", b:f.contract.clause==="b"}; }); }
function migratePromoter(w){ if(w.mode!=="manager" || w.promoFix) return; w.promoFix=true; myCo(w); registerMe(w);
  Object.values(w.fighters).forEach(f=>{ if(f.managed && !f.deal){ f.promoter="ME"; f.deal={end:yearOf(w)+2, guarantee:guaranteeFor(w,f), bonus:0}; f.happy=f.happy||65; } }); }
function migrateWorld(w){ applyEra(w); Object.values(w.fighters).forEach(migrateFighter); setTimeout(()=>{},0); seedJudges(w); lineageInit(w); w.rivals=w.rivals||{}; trainersInit(w); Object.values(w.fighters).forEach(f=>{ if(!f.trainer) assignTrainer(w,f); }); bodyInit(w); w.events=w.events||[]; seedDepth(w); if(!w.era){ const added=Object.keys(SEED).filter(dk=>loadDivision(w,dk)); if(added.length) addNews(w,`New divisions loaded: ${added.map(k=>DIVMAP[k].n).join(', ')}.`,'sys'); } migrateDual(w); migrateH2H(w); migratePop(w); migrateContracts(w); if(w.company) registerMe(w); migratePromoter(w); resortTop(w); if(!w.realProspects){ w.realProspects=true; const n=loadProspects(w); if(n) addNews(w,`${n} real-life prospects have been added to the world.`,'sys'); } w.fights.forEach(f=>{ if(!f.ev) assignEvent(w,f); if(!f.contract) f.contract=defaultContract(w,w.fighters[f.a],w.fighters[f.b],f.div); }); w.v=5; }

function render(){
  if(!W){ renderSetup(); return; }
  const dueMine = W.fights.filter(f=>f.wk<=W.week+1 && (F(f.a).managed||F(f.b).managed));
  let h = `<header class="top"><div class="row"><div class="brand">The Fight Game<small>${dateLabel(W)} · ${W.mode==="manager"?esc(myCo(W).name):"Sandbox"}</small></div><div class="grow"></div>
    <button class="btn" data-act="search" aria-label="Search fighters">Search</button><button class="btn" data-act="simmenu">Sim ahead</button><button class="btn primary" id="adv">${dueMine.length?"Fight night":"Advance week"}</button></div>${SIM?`<div class="simbar"><span>${esc(SIM.label)}: week ${SIM.done} of ${SIM.total}</span><button class="btn small" data-act="simstop">Stop</button></div>`:""}</header><main class="wrap">`;
  h += ({rank:viewRank, sched:viewSched, news:viewNews, stable:viewStable, more:viewMore}[V.tab]||viewRank)();
  h += `</main><nav class="tabs"><div class="in">`;
  const tabs=[["rank","Rankings"],["sched","Fights"],["news","News"]];
  tabs.push(W.mode==="manager"?["stable","Company"]:["stable","Booker"]); tabs.push(["more","More"]);
  h += tabs.map(([k,n])=>`<button data-tab="${k}" aria-current="${V.tab===k}">${n}</button>`).join("");
  h += `</div></nav>`;
  if(V.overlay) h += renderOverlay();
  $app.innerHTML=h;
  if(V.overlay && V.overlay.t==="watch") { const el=document.getElementById("rounds-end"); if(el && V.watch && V.watch.shown>1) el.scrollIntoView({block:"end"}); }
}

function comClick(d){ // returns true when handled

  if(d.ctab){ V.overlay={t:"commish", tab:d.ctab, div:o.div}; render(); return true; }

  if(d.cbody!==undefined){ o.body=d.cbody; render(); return true; }
  if(d.cpick!==undefined){ o.pick=d.cpick||null; render(); window.scrollTo(0,0); return true; }
  if(d.caward){ const [dk,b,id]=d.caward.split("|"); if(!confirm(`Award the ${b} ${DIVMAP[dk].n.toLowerCase()} title to ${F(id).name}?`)) return true; comAward(W,dk,b,id); if(o&&o.t==="commish") o.pick=null; return done("Title awarded"); }
  if(d.cvac){ const [dk,b]=d.cvac.split("|"); if(!confirm(`Strip ${F(W.belts[dk][b]).name} of the ${b} title?`)) return true; comVacate(W,dk,b); return done("Title vacated"); }
  if(d.cvfight){ const [dk,b]=d.cvfight.split("|"); const g=comVacantFight(W,dk,b); return done(g&&!g.dummy?"Vacant title fight ordered":"Not enough free contenders"); }
  if(d.cinter){ const [dk,b]=d.cinter.split("|"); const g=comInterim(W,dk,b); return done(g&&!g.dummy?"Interim title fight ordered":"Not enough free contenders"); }
  if(d.crank){ const [id,to]=d.crank.split("|"); comMoveRank(W,o.div,id,+to,o.body||null); return done(); }
  if(d.crankto){ const n=prompt(`Move ${F(d.crankto).name} to which spot?`,"1"); if(n===null||!(+n>=1)) return true; comMoveRank(W,o.div,d.crankto,+n-1,o.body||null); return done(); }
  if(d.cbodyrm){ const L=W.bodyRank[o.div][o.body]; L.splice(L.indexOf(d.cbodyrm),1); return done(); }
  if(d.cmpick){ o.mpick=d.cmpick; render(); return true; }
  if(d.cmand){ const [dk,b,id]=d.cmand.split("|"); comOrderMand(W,dk,b,id); o.mpick=null; return done("Mandatory ordered"); }
  if(d.cmcancel){ const [dk,b]=d.cmcancel.split("|"); comCancelMand(W,dk,b); return done("Order cancelled"); }
  if(d.cinjure){ const t=(document.getElementById("cinj")||{}).value||"hand"; comInjure(W,F(d.cinjure),t); return done("Injury applied"); }
  if(d.cheal){ comHeal(W,F(d.cheal)); return done("Cleared"); }

  if(d.dok){ const g=W.fights.find(x=>x.id===+d.dok); if(g) g.review=false; if(o&&o.t==="fightcom") V.overlay={t:"commish",tab:"desk"}; return done("Approved"); }
  if(d.dveto){ const g=W.fights.find(x=>x.id===+d.dveto); if(g) deskVeto(W,g); if(o&&o.t==="fightcom") V.overlay={t:"commish",tab:"desk"}; return done("Vetoed"); }
  if(d.fcom){ V.overlay={t:"fightcom", id:+d.fcom, back:o&&o.t==="commish"?{t:"commish",tab:o.tab,div:o.div}:null}; render(); window.scrollTo(0,0); return true; }
  if(d.fdate){ const [id,n]=d.fdate.split("|"); const g=W.fights.find(x=>x.id===+id); if(g) comMoveDate(W,g,+n); return done(`Moved to ${dateLabel(W,g.wk)}`); }
  if(d.fvenue){ const g=W.fights.find(x=>x.id===+d.fvenue); V.overlay={t:"venue", id:g.ev, back:{t:"fightcom", id:g.id, back:o.back}}; render(); window.scrollTo(0,0); return true; }
  if(d.fswap){ const [,side]=d.fswap.split("|"); o.swap=side; render(); return true; }

  return false;
}

function doAdvance(n){
  const from=W.week+1, ids=[];
  const finish=()=>{ if(ids.length) W.lastRecap={from, to:W.week, ids:ids.slice()}; };
  for(let i=0;i<n;i++){
    const dueMine=W.fights.filter(f=>f.wk<=W.week+1 && (F(f.a).managed||F(f.b).managed));
    if(dueMine.length){ finish(); persist(); V.overlay={t:"night"}; render(); return; }
    const outs=advanceWeek(W); outs.forEach(o=>ids.push(o.id));
    const mine=outs.filter(o=>F(o.a).managed||F(o.b).managed);
    if(mine.length){ finish(); V.watch={out:mine[0],shown:mine[0].log.length}; V.overlay={t:"watch"}; persist(); render(); return; }
  }
  W.lastRecap={from, to:W.week, ids};
  persist();
  if(W.showRecap!==false && ids.length){ V.overlay={t:"recap"}; render(); window.scrollTo(0,0); }
  else { render(); toast(`${dateLabel(W)}${ids.length?"":" · quiet week"}`); }
}
function quickSim(){
  const due=W.fights.filter(f=>f.wk<=W.week+1 && (F(f.a).managed||F(f.b).managed)); let last=null;
  for(const fg of due){ prepFight(W,fg); const sim=runBout(W,fg,F(fg.a),F(fg.b)); last=applyResult(W,fg,sim); }
  W.fights=W.fights.filter(f=>!f.done);
  if(last){ V.watch={out:last,shown:last.log.length}; V.overlay={t:"watch"}; }
  persist(); render();
}

const CSV_ALIAS={name:"name",nickname:"nick",nick:"nick",nationality:"nat",country:"nat",nat:"nat",age:"age",division:"div",div:"div",wins:"w",w:"w",losses:"l",l:"l",draws:"d",d:"d",kos:"ko",ko:"ko",style:"style",promoter:"promoter",traits:"traits",stance:"stance",hand:"stance",handedness:"stance",height:"ht",reach:"reach",
  power:"pow",pow:"pow",handspeed:"hspd",speed:"hspd",hspd:"hspd",accuracy:"acc",acc:"acc",jab:"jab",bodyattack:"body",body:"body",headmovement:"def",defense:"def",def:"def",guard:"guard",footwork:"foot",foot:"foot",
  chin:"chin",bodytoughness:"dur",durability:"dur",dur:"dur",stamina:"sta",sta:"sta",recovery:"rec",rec:"rec",iq:"iq",ringiq:"iq",heart:"heart",aggression:"aggr",aggr:"aggr"};
const CSV_OLD=["name","nick","nat","age","div","w","l","d","ko","pow","spd","chin","sta","def","iq","style"];
function parseCsv(text){
  const rows=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const out=[]; let cur="",q=false; for(const ch of l){ if(ch==='"'){q=!q;} else if(ch===','&&!q){out.push(cur.trim());cur="";} else cur+=ch; } out.push(cur.trim()); return out; });
  let cols=CSV_OLD, oldFmt=true;
  if(rows.length && /^name$/i.test(rows[0][0])){ const hdr=rows.shift().map(h=>CSV_ALIAS[h.toLowerCase().replace(/[^a-z]/g,"")]||null);
    if(!hdr.slice(9).some(h=>h==="hspd"&&false) && hdr.some(h=>["hspd","acc","jab","guard","foot","dur","rec","heart","aggr","ht","reach","stance","promoter","traits"].includes(h))){ cols=hdr; oldFmt=false; } }
  let added=0, skipped=0;
  for(const r of rows){
    const v={}; cols.forEach((c,i)=>{ if(c) v[c]=r[i]; });
    const dk=(v.div||"").toUpperCase(); if(!v.name || !DIVMAP[dk]){ skipped++; continue; }
    const W_=+v.w||0,L_=+v.l||0; const base=clamp(Math.round(60+Math.min(W_,30)*.6-L_*1.5),50,85);
    const st=STYLES.find(x=>x.toLowerCase()===(v.style||"").toLowerCase())||"Boxer-Puncher";
    let at;
    if(oldFmt && ["pow","spd","chin","sta","def","iq"].every(k=>+v[k])) at=expandOld({pow:+v.pow,spd:+v.spd,chin:+v.chin,sta:+v.sta,def:+v.def,iq:+v.iq},st,v.name);
    else { at=makeAttrs(base,st,v.name); ATTR_KEYS.forEach(k=>{ const n=+v[k]; if(n) at[k]=clamp(Math.round(n),k==="aggr"?1:30,99); }); if(oldFmt&&+v.spd){ at.hspd=clamp(+v.spd,30,99); } }
    const f=migrateFighter(newFighter({name:v.name,nick:v.nick||"",nat:(v.nat||"").toUpperCase(),age:+v.age||27,div:dk,w:W_,l:L_,d:+v.d||0,ko:+v.ko||0,style:st,attrs:at,pop:30,verified:2,ht:+v.ht||0,reach:+v.reach||0,stance:(STANCES.find(x=>x.toLowerCase()===(v.stance||"").toLowerCase().replace("lefty","southpaw").replace("left","southpaw"))||"")}));
    if(v.promoter){ const pk=PROMOTERS.find(p=>p.k.toLowerCase()===v.promoter.toLowerCase()||p.n.toLowerCase()===v.promoter.toLowerCase()); if(pk){ f.promoter=pk.k; f.promoEst=false; } }
    if(v.traits){ const tk=v.traits.split(/[;|]/).map(x=>x.trim().toLowerCase()).map(x=>Object.keys(TRAITS).find(k=>k===x||TRAITS[k].n.toLowerCase()===x)).filter(Boolean); if(tk.length) f.traits=tk.slice(0,3); }
    W.fighters[f.id]=f; W.order[dk].push(f.id); added++;
  }
  return {added,skipped};
}

// ================= BOOT =================
(async function boot(){
  try{ const th=localStorage.getItem("fg-theme"); if(th&&th!=="auto") document.documentElement.setAttribute("data-theme",th); }catch(e){}
  $app.innerHTML=`<div class="setup"><div class="brand">The Fight Game<small>Loading your world…</small></div></div>`;
  await Store.openIdb();
  Store.slot = (await Store.idbGet("curSlot")) || "s1";
  const local = await Store.idbGet(Store.key());
  if(local){ W=local; migrateWorld(W); render(); }
  await Store.connect();
  if(Store.cloud){
    const cloud = await Store.cloudLoad();
    if(cloud && (!W || cloud.savedAt > W.savedAt)){
      if(W){ Object.values(cloud.fighters).forEach(f=>{ const lf=W.fighters[f.id]; if(!f.portrait && lf && lf.portrait) f.portrait=lf.portrait; }); }
      W=cloud; migrateWorld(W); Store.idbSet(Store.key(),W); render();
    } else if(W){ Store.cloudSave(W); }
  }
  if(!W) render();
})();
